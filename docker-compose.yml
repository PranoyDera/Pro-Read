services:
  postgres:
    image: postgres:16-alpine
    container_name: story-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: story_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d story_platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: story-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/story_platform
      DB_SSL: "false"
      JWT_SECRET: change_this_to_a_secure_secret
      JWT_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5000"

  frontend:
    build:
      context: ./Frontend/pro-read
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: story-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      backend:
        condition: service_started
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: story-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

volumes:
  postgres_data:
